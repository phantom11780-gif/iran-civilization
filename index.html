<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>دانلود اینستاگرام</title>

<style>
body{
    font-family:tahoma;
    background:#f2f2f2;
    text-align:center;
    padding:50px;
}

.box{
    background:white;
    max-width:400px;
    margin:auto;
    padding:25px;
    border-radius:15px;
}

input,button{
    width:90%;
    padding:12px;
    margin:10px;
    border-radius:8px;
    border:1px solid #ddd;
}

button{
    background:#e1306c;
    color:white;
    cursor:pointer;
    border:none;
}

#result{
    margin-top:20px;
}
</style>

</head>

<body>

<div class="box">

<h2>دانلود از اینستاگرام</h2>

<input id="url" placeholder="لینک پست اینستاگرام">

<button onclick="download()">دانلود</button>

<div id="result"></div>

</div>


<script>

async function download(){

let url=document.getElementById("url").value;

if(!url){
document.getElementById("result").innerHTML="لینک را وارد کنید";
return;
}

document.getElementById("result").innerHTML="در حال پردازش...";


let res=await fetch(
"https://YOUR-WORKER.workers.dev",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
url:url
})
});


let data=await res.json();


if(data.download){

document.getElementById("result").innerHTML=
`<a href="${data.download}" download>
دانلود فایل
</a>`;

}else{

document.getElementById("result").innerHTML=
"خطا در دریافت فایل";

}

}

</script>

</body>
</html>
